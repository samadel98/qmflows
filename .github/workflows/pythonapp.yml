name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CP2K_DATA_DIR: "${{ github.workspace }}/cp2k/data"
  PY_COLORS: "1"

jobs:
  Test:
    name: ${{ matrix.os }} (py ${{ matrix.version }}) ${{ join(matrix.special, ' ') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        special: ['']
        exclude:
          # setup-python has no Python 3.8 and 3.9 builds for Ubuntu 26.04
          - os: ubuntu-latest
            version: '3.8'
          - os: ubuntu-latest
            version: '3.9'
        include:
          - os: ubuntu-24.04
            special: ''
            version: '3.8'
          - os: ubuntu-24.04
            special: ''
            version: '3.9'
          - os: ubuntu-latest
            special: ['pre-release']
            version: '3.14'
          - os: ubuntu-latest
            special: ['no optional']
            version: '3.11'
          - os: ubuntu-latest
            special: ['no optional']
            version: '3.14'
          # The oldest supported PLAMS version, which predates the PLAMS 2025 API changes
          - os: ubuntu-latest
            special: ['PLAMS', '1.5.1']
            version: '3.11'
          - os: ubuntu-latest
            special: ['CP2K', '6.1', 'ssmp']
            version: '3.13'
          - os: ubuntu-latest
            special: ['CP2K', '7.1', 'ssmp']
            version: '3.13'
          - os: ubuntu-latest
            special: ['CP2K', '8.2', 'ssmp']
            version: '3.13'
          - os: ubuntu-latest
            special: ['CP2K', '9.1', 'ssmp']
            version: '3.13'
          - os: ubuntu-latest
            special: ['CP2K', '2022.1', 'ssmp']
            version: '3.13'
          - os: ubuntu-latest
            special: ['CP2K', '2023.1', 'ssmp']
            version: '3.13'
          - os: ubuntu-latest
            special: ['CP2K', '2024.2', 'ssmp']
            version: '3.13'
          - os: ubuntu-latest
            special: ['CP2K', '2025.2', 'ssmp']
            version: '3.13'
          - os: ubuntu-latest
            special: ['CP2K', '2026.2', 'ssmp']
            version: '3.13'
          # The CP2K versions of apt and Homebrew are whatever they currently ship
          # (Homebrew only provides the MPI-parallel cp2k.psmp)
          - os: ubuntu-latest
            special: ['CP2K', 'apt', 'psmp']
            version: '3.13'
          - os: macos-latest
            special: ['CP2K', 'brew', 'psmp']
            version: '3.13'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install cp2k
      if: matrix.special[0] == 'CP2K'
      run: bash scripts/download_cp2k.sh x86_64 ${{ matrix.special[1] }} ${{ matrix.os }} ${{ matrix.special[2] }}

    - name: Info CP2K
      if: matrix.special[0] == 'CP2K'
      run: cp2k.${{ matrix.special[2] }} --version

    - name: Info MPI
      if: matrix.special[2] == 'psmp'
      run: mpirun --version

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.version }}

    - name: Install dependencies
      run: |
        case "${{ matrix.special[0] }}" in
          "pre-release")
            pip install --pre -e .[test] --upgrade --force-reinstall
            pip install git+https://github.com/SCM-NV/PLAMS@trunk --upgrade
            pip install git+https://github.com/NLeSC/noodles@master --upgrade
            ;;
          "no optional")
            pip install -e .[test-no-optional]
            ;;
          "PLAMS")
            pip install -e .[test] "plams==${{ matrix.special[1] }}"
            ;;
          *)
            pip install -e .[test]
            ;;
        esac

    - name: Python info
      run: |
        which python
        python --version

    - name: Installed packages
      run: pip list

    - name: Test with pytest
      run: |
        case "${{ matrix.special[0] }}" in
          "no optional")
            pytest -m 'not (slow or long)' test ;;
          "CP2K")
            if [[ "${{ matrix.special[2] }}" == 'psmp' ]]; then
              export QMFLOWS_CP2K_COMMAND='mpirun cp2k.psmp'
            fi
            if [[ "${{ matrix.os }}" == 'macos-latest' ]]; then
              export VECLIB_MAXIMUM_THREADS=1
            fi
            pytest -m '(slow or long)' ;;
          *)
            pytest -m 'not (slow or long)' ;;
        esac

    # Needs a `CODECOV_TOKEN` repository secret; a failed upload does not fail the job
    - uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install linters
        run: pip install .[lint]

      - name: Python info
        run: |
          which python
          python --version

      - name: Installed packages
        run: pip list

      - name: Run flake8
        run: flake8 src test conftest.py

      - name: Run pydocstyle
        run: pydocstyle src

      - name: Run mypy
        run: mypy src
        continue-on-error: true
